<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kryptiden</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="console">
  <div class="console-top"><span>KRYPTIDEN</span><span class="power-led" aria-hidden="true"></span></div>
  <div class="screen-frame">
    <div class="screen" id="screenBox">

      <div id="screen-intro" style="flex:1;position:relative;padding:0;display:flex;">
        <canvas id="introCanvas" width="352" height="352"></canvas>
        <div id="introOverlay">
          <h1 id="introTitle">KRYPTIDEN</h1>
          <p id="introTagline">Irgendwo dort draußen warten sie.</p>
        </div>
        <button id="btnIntroSkip">Tippen zum Überspringen ▶</button>
      </div>

      <div id="screen-title" class="hidden">
        <h1>KRYPTIDEN</h1>
        <p style="font-size:12px">Wähle deinen Partner:</p>
        <div class="starter-row" id="starterRow"></div>
        <button id="btnTitleCode" class="secondary" style="width:100%">📋 Mit Spielstand-Code fortsetzen</button>
        <div id="titleCodeBox" class="hidden">
          <textarea id="titleCodeArea" spellcheck="false" placeholder="Code hier einfügen..."></textarea>
          <div class="action-grid">
            <button id="btnTitleCodeLoad">▶ Laden</button>
            <button id="btnTitleCodeCancel" class="secondary">Abbrechen</button>
          </div>
        </div>
        <p id="storageNote" style="font-size:10.5px;opacity:.7;line-height:1.35;margin-top:4px"></p>
      </div>

      <div id="screen-world" class="hidden" style="flex:1;position:relative;">
        <canvas id="worldCanvas" width="352" height="352"></canvas>
        <div class="world-toast" id="worldToast"></div>
        <div id="npcBox" class="hidden">
          <div id="npcName"></div>
          <div id="npcText"></div>
          <button id="npcNext">Weiter ▶</button>
        </div>
      </div>

      <div id="screen-battle" class="hidden" style="flex:1;display:flex;flex-direction:column;">
        <canvas id="battleCanvas" width="332" height="196"></canvas>
        <div class="msg-box" id="msgBox"></div>
        <div class="action-grid hidden" id="actionMain">
          <button id="btnFight">⚔️ Rufen</button>
          <button id="btnBag">🎒 Beutel</button>
          <button id="btnCatch">👥 Gefährten</button>
          <button id="btnSwitch" class="secondary">💨 Rückzug</button>
          <button id="btnFlee" class="secondary hidden">↩ Auswahl zurück</button>
        </div>
        <div class="action-grid hidden" id="actionContinue">
          <button id="btnContinue" class="span2">Weiter ▶</button>
        </div>
        <div class="action-grid hidden" id="actionSub"></div>
      </div>

      <div id="screen-team" class="hidden" style="flex:1;display:flex;flex-direction:column;">
        <div class="mhead" id="menuHead"></div>
        <div class="tabs" id="menuTabs">
          <button data-tab="team">GEFÄHRTEN</button>
          <button data-tab="box">BOX</button>
          <button data-tab="bag">BEUTEL</button>
          <button data-tab="dex">KATALOG</button>
          <button data-tab="quests">QUESTS</button>
          <button data-tab="typen">TYPEN</button>
        </div>
        <div class="list" id="menuList"></div>
        <div id="saveStatus"></div>
        <div id="codeBox" class="hidden">
          <textarea id="codeArea" spellcheck="false"></textarea>
          <div class="action-grid">
            <button id="btnCodeCopy">📄 Kopieren</button>
            <button id="btnCodeLoad">📥 Laden</button>
            <button id="btnCodeClose" class="secondary span2">Schließen</button>
          </div>
        </div>
        <div class="action-grid sticky-bottom">
          <button id="btnSave">💾 Speichern</button>
          <button id="btnCode" class="secondary">📋 Code</button>
          <button id="btnBackWorld" class="secondary span2">◀ Zurück</button>
        </div>
      </div>

      <div id="screen-dex" class="hidden" style="flex:1;display:flex;flex-direction:column;">
        <h2 id="dexTitle">KATALOG</h2>
        <div class="list dexgrid" id="dexGrid"></div>
        <button id="btnDexBack" class="secondary sticky-bottom" style="margin-top:6px">◀ Zurück</button>
        <div id="dexDetail" class="hidden" style="position:absolute;inset:0;background:var(--screen-bg);padding:10px;display:flex;flex-direction:column;z-index:6;">
          <div id="dexDetailBody" style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;"></div>
          <button id="btnDexDetailClose" class="secondary sticky-bottom" style="margin-top:6px">◀ Zurück zum Katalog</button>
        </div>
      </div>

      <div id="screen-shop" class="hidden" style="flex:1;display:flex;flex-direction:column;">
        <div class="mhead" id="shopMoney"></div>
        <div class="tabs" id="shopTabs">
          <button data-shop="pflege">🧪 PFLEGE</button>
          <button data-shop="fang">🔴 FANG</button>
          <button data-shop="ausruest">🎽 AUSRÜSTUNG</button>
          <button data-shop="lehrer">📜 LEHRER</button>
        </div>
        <div class="list" id="shopList"></div>
        <button id="btnShopBack" class="secondary sticky-bottom" style="margin-top:6px">◀ Verlassen</button>
      </div>

      <div id="fatal" class="hidden"></div>
    </div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-dir="up" aria-label="Hoch">▲</button>
      <button class="left" data-dir="left" aria-label="Links">◀</button>
      <div class="center"></div>
      <button class="right" data-dir="right" aria-label="Rechts">▶</button>
      <button class="down" data-dir="down" aria-label="Runter">▼</button>
    </div>
    <div class="side-btns">
      <div class="ab-btns">
        <button id="btnConfirm" class="ab-btn confirm" aria-label="Bestätigen">✓</button>
        <button id="btnCancel" class="ab-btn cancel" aria-label="Zurück">✕</button>
      </div>
      <button id="btnMenu">MENÜ</button>
    </div>
  </div>
  <div class="console-bottom">MODELL HGB-06</div>
</div>

<script>
window.__booted=false;
window.__showFatal=function(m,hard){
  var f=document.getElementById('fatal');
  if(f){f.classList.remove('hidden');f.textContent='⚠️ '+m;}
  if(hard&&!window.__booted){
    var ids=['screen-intro','screen-title','screen-world','screen-battle','screen-team','screen-dex','screen-shop'];
    for(var i=0;i<ids.length;i++){var e=document.getElementById(ids[i]);if(e)e.classList.add('hidden');}
  }
};
window.addEventListener('error',function(ev){
  if(window.__booted)return;
  window.__showFatal((ev.message||'Unbekannt')+' ('+(ev.lineno||0)+':'+(ev.colno||0)+')',true);
});
window.addEventListener('unhandledrejection',function(ev){
  if(window.__booted)return;
  var r=ev.reason;window.__showFatal('(Promise) '+(r&&r.message?r.message:r),true);
});
</script>
<script src="js/game.js"></script>
</body>
</html>
